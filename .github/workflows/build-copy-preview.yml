name: Build Quick Look Copy Preview

on:
  push:
    branches:
      - agent/build-quick-look-copy-preview

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run Swift tests
        run: swift test --package-path tests/swift-tests

      - name: Build unsigned debug app
        run: |
          xcodebuild \
            -project md-preview.xcodeproj \
            -scheme md-preview \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Debug/Markdown Preview.app" \
            "$RUNNER_TEMP/Markdown-Preview-Debug.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Markdown-Preview-Debug
          path: ${{ runner.temp }}/Markdown-Preview-Debug.zip
          if-no-files-found: error
